name: CI / Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      BACKEND_IMAGE: hr-management-backend
      FRONTEND_IMAGE: hr-management-frontend
      POSTGRES_IMAGE: postgres:15-alpine
      BACKEND_PORT: 8081
      FRONTEND_PORT: 3000

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache Node modules for frontend
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build backend JAR
        run: |
          chmod +x ./mvnw
          ./mvnw -B clean package -DskipTests

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend Docker image
        run: |
          docker build --file dockerfile --tag $BACKEND_IMAGE:latest .

      - name: Build frontend Docker image
        run: |
          docker build --file frontend/Dockerfile --tag $FRONTEND_IMAGE:latest ./frontend

      - name: Push backend Docker image
        run: |
          docker tag $BACKEND_IMAGE:latest ${{ secrets.DOCKERHUB_USERNAME }}/$BACKEND_IMAGE:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/$BACKEND_IMAGE:latest

      - name: Push frontend Docker image
        run: |
          docker tag $FRONTEND_IMAGE:latest ${{ secrets.DOCKERHUB_USERNAME }}/$FRONTEND_IMAGE:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/$FRONTEND_IMAGE:latest

      - name: Upload build artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-artifacts
          path: |
            target/demo-0.0.1-SNAPSHOT.jar
            frontend/build