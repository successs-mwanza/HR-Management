name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test backend
        run: |
          chmod +x ./mvnw
          ./mvnw -B test
          ./mvnw -B package -DskipTests

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: CI=true npm run build

  docker:
    name: Docker Publish
    # Removed the invalid job-level secret check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [backend, frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Verify secrets exist using intermediate environment variables before running Docker steps
      - name: Check Docker Hub Credentials
        id: check-secrets
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKER_USER" ] || [ -z "$DOCKER_TOKEN" ]; then
            echo "Missing required Docker Hub secrets. Skipping publishing."
            echo "run_publish=false" >> $GITHUB_OUTPUT
          else
            echo "run_publish=true" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        if: steps.check-secrets.outputs.run_publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        if: steps.check-secrets.outputs.run_publish == 'true'
        run: |
          docker build -f dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/hr-management-backend:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/hr-management-backend:latest

      - name: Build and push frontend image
        if: steps.check-secrets.outputs.run_publish == 'true'
        run: |
          docker build -f frontend/Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/hr-management-frontend:latest ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/hr-management-frontend:latest